# AutoDJ Configuration
# ============================
# Copy this file to config.toml and edit as needed.
# All settings are documented below with their types and valid ranges.
#
# Configuration precedence (highest to lowest):
#   1. Command-line arguments (--flag=value)
#   2. config.toml (this file)
# 3. Built-in defaults (shown in comments)
#
# Validation: On startup, config.toml is validated. Any invalid value raises a
# ConfigError with the exact line number and a marker pointing to the problem.
# See autodj/config.py for the complete validation logic.

# --- Core Bot Identity --------------------------------------------------------
bot_nick = "AutoDJ" # Nickname the bot uses in the room (its own lines are ignored)
admins = ['Seaza', 'N00M', 'zdevz'] # Case-insensitive list of admin nicks (no default; configure operator nicks only)
# WARNING: Nickname-based authorization is spoofable. Prefer immutable authenticated
# account identifiers where the chat protocol supports them.
prefix = "!" # Command prefix (e.g. "!", "/", ".")
lang = "th" # "en" | "th": bot replies + GUI language (switchable live in the GUI)

# --- Chat I/O (UI Automation / Log Tail / Console) ---------------------------
# chat_reader: "uia" (Windows UI Automation), "logtail" (read chat log file), "console" (stdin for testing)
# chat_sender: "uia" (UIA send), "logtail" (write to log file), "console" (stdout)
chat_reader = "uia"
chat_sender = "uia"

# Window discovery (used when chat_reader/chat_sender = "uia")
window_title_re = "ZeaZDev,\\ \u0e2b\u0e31\u0e27\u0e02\u0e49\u0e2d:\\ ZeaZDev" # Room window title regex (e.g. ".*: ห้องสนทนา"); auto_discover rewrites this
process_re = "(?i)camfrog" # Process exe name regex filter ("" = any process)
window_exclude_re = "" # Drop matching titles when several windows match
window_index = 0 # Pick the Nth remaining match (0 = first)
auto_discover = true # At startup: find room window + chat/input controls, save to config.toml
view_kind = "web" # auto | web (Camfrog room: embedded web panes) | text (Document/Edit controls)
send_mode = "auto" # background (no focus steal) | foreground (focus + paste) | auto (background, verify, fallback)
send_verify = true # auto mode: confirm line appeared in room before accepting background send
web_strict_body = true # Web view: drop plain text directly following a message body (date headers / system lines)
web_view_title = "wb-log-room-data" # Substring of the chat-history pane title (for UIA element search)
web_input_title = "wb-edit-data" # Substring of the message-box pane title (for UIA element search)
view_type = "Document" # Filled in by auto_discover (or tools/inspect_ui.py)
view_index = 0
input_type = "Edit"
input_index = -1

# Log file (optional, for logtail reader or additional logging)
log_path = "" # Camfrog chat log to READ when chat_reader = "logtail" (unused with "uia")
log_encoding = "utf-8" # Log file encoding

# Line parsing regex for logtail reader (must have named groups: user, text)
line_regex = "^(?:\\[?\\d{1,2}:\\d{2}(?::\\d{2})?\\]?\\s*)?(?P<user>[^:\\s][^:]{0,30}):\\s(?P<text>.+)$"

# --- Media Playback (mpv / yt-dlp) -------------------------------------------
# mpv and yt-dlp are installed alongside AutoDJ by the NSIS installer:
#   $INSTDIR/mpv/mpv.exe        (mpv player)
#   $INSTDIR/mpv/yt-dlp.exe     (YouTube downloader for mpv + title lookups)
# The installer writes absolute paths here; a relative path is resolved against the zAutoDJ.exe
# folder. Do not point these at $APPDATA/mpv: that is mpv's own per-user config folder.
# Example: mpv_path = "C:/mpv/mpv.exe"
mpv_path = "mpv/mpv.exe"
ytdlp_path = "" # "" = auto: yt-dlp(.exe) next to mpv or on PATH, else bundled Python module

# YouTube authentication (for age-restricted / private content)
youtube_cookies_file = "" # Path to Netscape cookies.txt for yt-dlp
youtube_cookies_browser = "" # Browser name for --cookies-from-browser (e.g. chrome, edge, firefox)
youtube_ca_bundle = "" # Path to custom CA bundle PEM file for yt-dlp certificate verification

# YouTube / mpv streaming optimization (reduce stuttering on YouTube links)
yt_format = "bestaudio[ext=m4a]/bestaudio/best" # Preferred yt-dlp format: m4a first (best streaming), then best audio
yt_cache_secs = 10.0 # Seconds of network stream to cache ahead in mpv (0 = disable)
yt_network_timeout = 30.0 # Seconds before mpv gives up on a network read (5-300)
yt_retries = 10 # yt-dlp retries for YouTube streams (1-100)
yt_fragment_retries = 10 # yt-dlp fragment retries (1-100)

# Audio output
audio_device = "auto" # "auto" = system default; or wasapi/{GUID} for virtual cable (run: mpv --audio-device=help)
volume = 70 # Playback volume 0-100

# Audio engineering
audio_fade = true # Enable audio volume fade-in and fade-out
audio_fade_in_sec = 1.2 # Fade-in duration in seconds (0.1-10.0)
audio_fade_out_sec = 1.5 # Fade-out duration on skip/stop in seconds (0.1-10.0)
audio_normalize = false # Enable dynamic audio loudness normalization (dynaudnorm filter)

# --- Local Music Library & TTS -----------------------------------------------
music_dirs = [] # Local library directories: requestable by name, also autoplayed
autoplay_sources = ['https://www.youtube.com/watch?v=HhVVVgYsBYw&t'] # Extra YouTube playlist URLs / folders / files to autoplay
shuffle = true # Shuffle autoplay pool

# --- Request / Queue Limits --------------------------------------------------
allowed_hosts = ['youtube.com', 'youtu.be', 'music.youtube.com'] # Allowed domains for !play
max_requests_per_user = 3 # Max concurrent requests per user (1-1000)
max_queue = 50 # Max queue length (1-100000)
max_duration = 900 # Max track duration for non-admin requests, seconds (1-604800)
voteskip_threshold = 3 # Votes needed to skip (1-1000)
cooldown = 3.0 # Seconds between commands from same user (0-3600)
send_interval = 1.5 # Seconds between chat lines sent by bot (flood control, 0-3600)
max_msg_len = 180 # Max message length sent to chat (20-2000)
announce_next = true # Announce up-next track in chat

# Answer "what song is this?" in the room without a command (reply = !np text + progress)
np_question_reply = true
np_question_keywords = ["\u0e40\u0e1e\u0e25\u0e07\u0e2d\u0e30\u0e44\u0e23", "\u0e40\u0e1e\u0e25\u0e07\u0e44\u0e23", "\u0e40\u0e1e\u0e25\u0e07\u0e0a\u0e37\u0e48\u0e2d", "\u0e0a\u0e37\u0e48\u0e2d\u0e40\u0e1e\u0e25\u0e07", "\u0e40\u0e1e\u0e25\u0e07\u0e19\u0e35\u0e49\u0e0a\u0e37\u0e48\u0e2d", "what song", "whats playing", "what's playing", "song name"]
np_question_cooldown = 20.0 # Room-wide seconds between auto-answers (0-3600)

# Now-playing / up-next message templates (leave empty to use built-in text for `lang`)
# Fields available: {title}, {duration}, {requester},
#   {elapsed} / {remaining} (progress of the current song),
#   {eta} (msg_next only: time until that song starts, e.g. "เพลงต่อไป อีก {eta}")
msg_now = "" # Override built-in now-playing text
msg_next = "" # Override built-in up-next text
ui_theme = "zplayer-dark" # GUI theme: zplayer-dark | zplayer-neon | zplayer-light

# Text-to-Speech (pyttsx3 / Windows SAPI)
tts_voice = "" # Substring of an installed voice name (Thai voice for Thai text)
tts_rate = 170 # Speech rate (words per minute)
tts_duck = 25 # Music volume while speaking (0-100)

# --- Auto Launch (Windows) ---------------------------------------------------
# Off = you open Camfrog/the room yourself; AutoDJ waits for the window.
auto_launch = false # Set true to have AutoDJ launch Camfrog and join the room automatically
camfrog_exe = "" # Path to Camfrog exe, required if auto_launch = true
client_title_re = ".*" # Main client window title regex
room = "ZeaZDev" # Your Camfrog room name, required if auto_launch = true
join_uri_template = "" # URI your Camfrog build accepts for joining; {room} is URL-encoded
launch_timeout = 60 # Seconds to wait for Camfrog to appear after auto-launch

# --- Moderation & Security ---------------------------------------------------
blocked_users = [] # Nicks whose commands are ignored (admins cannot be blocked)
# Admins can also use !block / !unblock live to modify this list at runtime

poll_interval = 0.5 # Seconds between chat reads; raise to 1.0 if AutoDJ uses too much CPU (0.05-60)

# IM Security
im_require_room_presence = true # Only users seen in room chat can DM the bot
allow_play_in_room = true # Song requests in room chat too (IM works for users in the room); false = IM only

# --- Logging -----------------------------------------------------------------
log_file = "" # Log file (rotating, 1 MB x 3). Relative names go to <install>/logs/ (APPDATA fallback). Empty = default autodj.log there.
# Relative paths are resolved to %APPDATA%/zAutoDJ/ so they are
# writable even when AutoDJ is installed to Program Files.

# JSON structured logging
log_json = false # Enable JSON structured logging output
log_json_fields = ["request_id", "delivery_id", "user", "track_id", "generation", "attempt_id", "category", "stage", "state"] # Extra fields to include in JSON logs

# --- Playlist Persistence ----------------------------------------------------
playlist_file = "" # User-requested tracks (!play / GUI request / !load) are appended here
# (deduplicated) and join the autoplay pool (random); "" = disable persistence
playlist_dir = "" # Directory of *.json playlist files auto-loaded at startup; "" = disabled (default off)
playlist_dir_autoload = false # Even with playlist_dir set, never auto-load demo playlists unless true

# --- YouTube Search ----------------------------------------------------------
search_limit = 1 # YouTube text-search results fetched per non-admin !play (1 = first match only; max 50)

# --- mpv Hang Detection ------------------------------------------------------
mpv_timeout = 30.0 # Seconds to wait for one mpv track before treating it as hung (0 = never, max 3600)

# --- Dynamic Moderation ------------------------------------------------------
voteskip_dynamic = false # Dynamic voteskip threshold based on participant count
voteskip_dynamic_pct = 30 # Percentage of participants required to skip (1-100)
voteskip_cooldown = 10.0 # Seconds between voteskips from same user (1-3600)
user_request_limit = 5 # Max song requests allowed per user within rate_limit_window (1-1000)
rate_limit_window = 300.0 # Rolling time window for per-user request limit, seconds (10-86400)

# --- Auto-reply (Scheduled Ads/Messages) -------------------------------------
auto_reply_enabled = true # Enable scheduled auto-reply messages to the room
auto_reply_interval = 60.0 # Seconds between auto-reply messages (min 60s, max 86400)
auto_reply_file = "ads-list.json" # JSON file with messages to rotate through

# IM Auto-reply: automatic reply to private/instant messages
im_auto_reply_enabled = true # Enable auto-reply to private/instant messages
im_auto_reply_message = "Thanks for your message! I'm a bot and will respond when I can. Use !help for commands."
im_auto_reply_cooldown = 60.0 # Seconds between auto-replies to the same user (avoid spam, 10-3600)
im_join_room_message = "\u0e01\u0e23\u0e38\u0e13\u0e32\u0e40\u0e02\u0e49\u0e32\u0e2b\u0e49\u0e2d\u0e07 camfrog:join:{room} \u0e01\u0e48\u0e2d\u0e19\u0e02\u0e2d\u0e40\u0e1e\u0e25\u0e07\u0e04\u0e23\u0e31\u0e1a" # private reply to an IM sender not in the room ({room}; camfrog:join:<room> = Join link; "" = none)

# --- Autoplay: Switch to Autoplay Pool After Idle Timeout --------------------
# Default song: plays at startup, and again when the request queue is empty and nobody
# has requested for autoplay_idle_timeout seconds (repeats until the next request).
# A request always cuts it; a *requested* song is never cut (later requests queue FIFO).
default_track = "https://www.youtube.com/watch?v=HhVVVgYsBYw" # e.g. "https://www.youtube.com/watch?v=HhVVVgYsBYw"; "" = autoplay pool only
autoplay_idle_timeout = 30.0 # Seconds with no requests (queue empty) before the default song / autoplay (0-86400)

# --- Admin Greeting ----------------------------------------------------------
admin_greeting_enabled = true # Greet admins when they enter the room (instead of the welcome)
admin_greeting_message = "\u0e2a\u0e27\u0e31\u0e2a\u0e14\u0e35\u0e04\u0e23\u0e31\u0e1a\u0e41\u0e2d\u0e14\u0e21\u0e34\u0e19 {admin} \u0e22\u0e34\u0e19\u0e14\u0e35\u0e15\u0e49\u0e2d\u0e19\u0e23\u0e31\u0e1a\u0e01\u0e25\u0e31\u0e1a\u0e21\u0e32!" # Greeting message, {admin} will be replaced
admin_greeting_cooldown = 3600.0 # Seconds between greetings for same admin (1 hour, 60-86400)

# --- IM Viewer ---------------------------------------------------------------
im_viewer_enabled = true # Show the IM / private message viewer tab in the GUI

# --- Font/Style Customization (GUI Preview Only) -----------------------------
# Camfrog desktop client does NOT support rich text in outgoing messages.
# This configuration is used ONLY for the FontEditor preview panel in the GUI.
# Sent messages are always plain text via UIA.
message_style = { font_family = "Tahoma", font_size = 14, font_color = "#FF0000", bold = true, italic = false, underline = false }

# --- Admin Mic Mute/Unmute (Config-Gated) ------------------------------------
admin_mute_mic = true # Enable !mute command
admin_unmute_mic = true # Enable !unmute command

# --- Block/Unblock User (Config-Gated) ---------------------------------------
admin_block_user = false # Enable !block user command (admin can block a user)
admin_unblock_user = false # Enable !unblock user command (admin can unblock a user)

# --- Mic Mute State ----------------------------------------------------------
mute_enabled = false # Mic muted state (persisted)

# --- Block/Unblock Bot (Config-Gated) ----------------------------------------
admin_block_bot = true # Enable !blockbot command
admin_unblock_bot = true # Enable !unblockbot command

# --- Kick/Ban/Unban User (Config-Gated) --------------------------------------
admin_kick_user = true # Enable !kick command
admin_ban_user = true # Enable !ban command
admin_unban_user = true # Enable !unban command

# --- Punish User/Bot (Config-Gated) ------------------------------------------
admin_punish_user = true # Enable !punish command
admin_punish_bot = true # Enable !punishbot command

# --- Delete Message (Config-Gated) -------------------------------------------
admin_delete_message_enabled = true # Enable !delete <msg id> command

# --- Welcome Message ---------------------------------------------------------
# Every user who enters the room is greeted once per cooldown (admins get admin_greeting_message).
# Arrival is detected from the room's join notice (join_line_regex); without one, users are
# greeted on their first message instead.
welcome_message_enabled = true # Greet users entering the room
welcome_message_message = "\u0e22\u0e34\u0e19\u0e14\u0e35\u0e15\u0e49\u0e2d\u0e19\u0e23\u0e31\u0e1a {user} \u0e40\u0e02\u0e49\u0e32\u0e2a\u0e39\u0e48 {room} \u0e2a\u0e16\u0e32\u0e19\u0e35\u0e40\u0e1e\u0e25\u0e07 \u0e2d\u0e31\u0e15\u0e42\u0e19\u0e21\u0e31\u0e15\u0e34 24/7 \u0e0a\u0e31\u0e48\u0e27\u0e42\u0e21\u0e07" # {user} = nick, {room} = room name
welcome_message_cooldown = 3600.0 # Seconds between greetings for the same user (1 hour, 60-86400)
welcome_message_delay = 0.0 # Seconds to wait before sending the welcome (0 = instant; 0-3600)
# Mic/DJ greeting: announce a user when the room notice "<nick> is now speaking" (or the Thai
# equivalent) shows they got the mic. Ordinary chat never triggers it.
mic_greeting_enabled = true # Greet users who receive the room mic
mic_greeting_message = "" # {user} = nick; "" = the localized default from messages.py
mic_greeting_cooldown = 300.0 # Seconds between mic greetings for the same user (0-86400)
mic_notice_senders = [] # Room bots trusted to announce another nick on the mic, e.g. ["ZeazBot"] for "Seaza กำลังรับไมค์"
mic_greeting_ignore = [] # Nicks never greeted on the mic, e.g. the account AutoDJ streams the music from
greeting_ignore = [] # Nicks never greeted by any greeting (welcome, admin, mic), e.g. the room's bots ["ZeazBot", "CloudBot"]
greeting_ignore_regex = "(?i)bot$" # Bot nicks never greeted (regex on the nick); default: any nick ending in "bot"; "" = off
# Room notice for someone entering; must contain (?P<user>...). "" = greet on first message only.
# The default covers "*** bob has joined the room", "bob has entered the room" and "สมชาย เข้าสู่ห้อง";
# check what your Camfrog client actually shows and adjust (single quotes keep backslashes).
join_line_regex = "^(?:\\[?\\d{1,2}:\\d{2}(?::\\d{2})?\\]?\\s*)?\\W{0,4}\\s*(?:(?P<user>[^\\s:]+)\\s+(?:has\\s+)?(?:joined|entered)\\b|(?P<user_th>[^\\s:]+)\\s+(?:\u0e44\u0e14\u0e49)?\u0e40\u0e02\u0e49\u0e32(?:\u0e2a\u0e39\u0e48|\u0e21\u0e32\u0e43\u0e19)?\u0e2b\u0e49\u0e2d\u0e07)"

# --- Camfrog RE Integrations (Gift / Avatar / Status / Status Alert) ---------
# Gift / virtual-gift announcement (detect gift messages in room chat; see docs/camfrog-re/08-feature-gift.md)
gift_announce_enabled = true # Announce virtual-gift messages sent to the room

# Avatar change announcement (detect avatar changes in room chat; see docs/camfrog-re/16-user-icon-avatar.md)
avatar_change_enabled = true # Announce avatar change messages sent to the room

# Status indicator announcement (detect online/away/busy/invisible/admin/moderator/owner; see docs/camfrog-re/14-png-assets.md)
status_indicator_enabled = true # Announce user status changes in room chat

# Status alerts (detect upgrade/payment-required status text; see docs/camfrog-re/07-upgrade-logic.md, 09-payment.md)
status_alert_enabled = true # Alert when Camfrog shows upgrade/payment-required status

# --- Webhook / API Integration -----------------------------------------------
webhook_enabled = false # Enable HTTP webhook server for external control
webhook_host = "127.0.0.1" # Host to bind webhook server (use 0.0.0.0 for external access)
webhook_port = 8080 # Port for webhook server (1-65535)
webhook_secret = "" # HMAC secret, >=16 chars (empty = every request rejected). Clients sign "<ts>.<METHOD>.<path>.<body>" + send X-Timestamp/X-Signature
webhook_rate_limit_per_ip = 60 # Max requests per IP per minute (1-10000)
webhook_cors_origins = ['*'] # CORS allowed origins (e.g. ["https://example.com"]; default ["*"] = all)

# --- Config Hot Reload -------------------------------------------------------
config_hot_reload = true # Enable hot reload of config.toml (requires 'watchdog' extra: pip install -e .[hotreload])

# --- Plugin System -----------------------------------------------------------
plugins = ['builtin.stats', 'builtin.help'] # List of plugin modules to load (e.g. "builtin.stats", "myplugin")

# ---- Auto-update (GitHub releases) — opt-in; no network traffic when false -------------
auto_update_enabled = false
auto_update_repo = "cvsz/autodj" # owner/name only
auto_update_check_interval = 21600.0 # seconds between background checks (min 300)
auto_update_asset = "zAutoDJ.exe" # release asset; must have a published SHA-256 digest
auto_update_apply_on_start = true # download latest zAutoDJ.exe from GitHub on launch and replace this install

# ---- AI answers (OpenAI-compatible API): only `!ai ask <question>` is sent to the provider; room chat never is
# Answers non-command room lines (never private IMs). https required except for localhost.
ai_enabled = true # on by default (still off until ai_api_key is set); false = !ai ask refused
ai_api_key = "" # NVIDIA key (nvapi-...) from https://build.nvidia.com/settings; keep this file private (it is git-ignored). Empty = AI stays off
ai_base_url = "https://integrate.api.nvidia.com/v1" # any OpenAI-compatible endpoint (https)
ai_model = "nvidia/llama-3.3-nemotron-super-49b-v1.5" # NVIDIA API catalog model id
ai_system_prompt = "You are AutoDJ, a music bot in a Camfrog room powered by NVIDIA AI. Keep replies short, friendly, and on-topic. Do not claim to play music unless asked."
ai_max_chars = 200 # reply length cap (Camfrog line limit)
ai_user_cooldown = 30.0 # seconds between AI replies to the same user


# ---------------------------------------------------------------------------
# Multi-platform streaming (ported from cvsz/streamdbc architecture)
# ---------------------------------------------------------------------------
# Stream/room registry tracks active broadcasts across platforms.
# Each platform has its own adapter: Camfrog (UIA), YouTube Live, TikTok Live,
# Facebook Live.  The registry assigns a safe stream_id per room and manages
# lifecycle (IDLE / LIVE / RECORDING / ERROR).

[streams]
enabled = false # Multi-platform stream registry off by default
registry_ttl_seconds = 86400.0 # Idle stream cleanup TTL (seconds)
max_concurrent_streams = 16 # Max simultaneous platform streams

# Auth for cross-platform control: JWT tokens scoped per stream, API keys for
# management.  Set streams.auth.enable = true to require tokens for
# publish/play actions from platform bots.
[streams.auth]
enable = false # Require JWT tokens for stream publish/play actions
jwt_secret = "REPLACE_ME_STREAM_JWT_SECRET_MIN_32_CHARS" # >=32 chars, keep private
jwt_expiry = "24h" # Token lifetime (Go duration: 24h, 30m, 15s)
api_keys = ["REPLACE_ME_STREAM_API_KEY_MIN_16_CHARS"] # >=16 chars each
allow_anonymous = false # Allow play tokens without authentication

# FFmpeg recorder: archives broadcasts from any platform to MP4 for later
# review or rebroadcast.  One recording per stream at a time.
[streams.recorder]
enable = false # Record platform streams to MP4
path = "$APPDATA/zAutoDJ/recordings" # Recordings directory (APPDATA fallback)
ffmpeg_path = "ffmpeg" # FFmpeg executable
max_active = 64 # Max concurrent recordings

# FFmpeg transcoder: produces adaptive-bitrate HLS from recordings for
# playback on any platform.  Hardware encoders (NVENC, QSV, AMF,
# VideoToolbox) are auto-detected with libx264 fallback.
[streams.transcoder]
enable = false # Transcode recordings to HLS ABR ladder
worker_count = 2 # Parallel FFmpeg transcoder workers
ffmpeg_path = "ffmpeg" # FFmpeg executable
gpu_enabled = false # Use hardware encoder (NVENC/QSV/AMF/VideoToolbox) if detected
output_format = "hls" # Output container (only "hls" supported)

[[streams.abr_ladder]]
name = "1080p"
width = 1920
height = 1080
bitrate = 5000000
frame_rate = 30
audio_bitrate = 192000

[[streams.abr_ladder]]
name = "720p"
width = 1280
height = 720
bitrate = 3000000
frame_rate = 30
audio_bitrate = 128000

[[streams.abr_ladder]]
name = "480p"
width = 854
height = 480
bitrate = 1500000
frame_rate = 30
audio_bitrate = 96000

[[streams.abr_ladder]]
name = "360p"
width = 640
height = 360
bitrate = 800000
frame_rate = 30
audio_bitrate = 64000

# Platform adapters (bounded, disabled by default).  Enable only after
# supplying the corresponding platform API credentials and media engine.
[streams.platforms.camfrog]
enable = true # Camfrog desktop UIA adapter (existing behavior)
chat_reader = "uia"
chat_sender = "uia"

[streams.platforms.youtube]
enable = false # YouTube Live chat adapter
api_key = "" # YouTube Data API v3 key
channel_id = "" # YouTube channel ID to monitor
# Probe account for YouTube OAuth2 login
[streams.platforms.youtube.probe_account]
email = "probe_youtube@example.com" # Probe account email
access_token = "" # OAuth2 access token (auto-refreshed)
refresh_token = "" # OAuth2 refresh token
client_id = "" # Google OAuth2 client ID
client_secret = "" # Google OAuth2 client secret

[streams.platforms.tiktok]
enable = false # TikTok Live chat adapter
room_id = "" # TikTok Live room ID (unique_id)
# Probe account for TikTokLive unofficial client
[streams.platforms.tiktok.probe_account]
username = "probe_tiktok" # TikTok username
password = "" # TikTok password (encrypted at rest)

[streams.platforms.facebook]
enable = false # Facebook Live comments adapter
page_id = "" # Facebook page ID running the live stream
access_token = "" # Facebook Graph API access token
# Probe account for Facebook Graph API login
[streams.platforms.facebook.probe_account]
email = "probe_facebook@example.com" # Probe account email
access_token = "" # Facebook Graph API access token
page_id = "" # Facebook page ID
client_id = "" # Facebook OAuth2 client ID
client_secret = "" # Facebook OAuth2 client secret






