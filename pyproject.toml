[project]
name = "camfrog-autodj"
version = "0.2.6"
requires-python = ">=3.11"
dependencies = [
  "yt-dlp",
  "mutagen",
  "pyttsx3",
  "pywinauto; sys_platform == 'win32'",
  "pyperclip; sys_platform == 'win32'",
]
[project.optional-dependencies]
dev = ["pytest"]
build = ["pyinstaller"]
[project.scripts]
camfrog-autodj = "camfrog_autodj.__main__:main"
[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["camfrog_autodj", "camfrog_autodj.adapters"]
[tool.pytest.ini_options]
testpaths = ["tests"]
# pythonpath = ["."]  # removed to avoid path resolution issues on CI

[tool.mypy]
# Third-party dependencies used by AutoDJ ship without type stubs
# (pywinauto, pyttsx3, mutagen, yt_dlp, pyperclip). Missing stubs are
# ignored so the release typecheck gate validates AutoDJ's own code
# instead of failing on unstubbed dependencies.
ignore_missing_imports = true
