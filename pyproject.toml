[project]
name = "camfrog-autodj"
version = "0.2.3"
requires-python = ">=3.11"
dependencies = [
  "yt-dlp",
  "mutagen",
  "pyttsx3",
  "pywinauto; sys_platform == 'win32'",
  "pyperclip; sys_platform == 'win32'",
]
[project.optional-dependencies]
dev = ["pytest"]
build = ["pyinstaller"]
[project.scripts]
camfrog-autodj = "camfrog_autodj.__main__:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["camfrog_autodj", "camfrog_autodj.adapters"]
[tool.pytest.ini_options]
testpaths = ["tests"]
# pythonpath = ["."]  # removed to avoid path resolution issues on CI
