[project]
name = "camfrog-autodj"
version = "0.3.8"
requires-python = ">=3.11"
dependencies = [
  "yt-dlp",
  "mutagen",
  "pyttsx3",
  "pywinauto; sys_platform == 'win32'",
  "pyperclip; sys_platform == 'win32'",
]
[project.optional-dependencies]
dev = ["pytest"]
build = ["pyinstaller"]
hotreload = ["watchdog>=7.1.0,<8"]
webhook = [
  # Upper bounds prevent a future major release from silently changing the
  # webhook API in a signed build; yt-dlp is intentionally left unbounded so
  # its extractors can keep up with site changes.
  "fastapi>=0.163.1,<1",
  "uvicorn>=0.54.0,<1",
  "pydantic>=2.14.3,<3",
  "httpx>=0.28.1,<1",
]
[project.scripts]
camfrog-autodj = "camfrog_autodj.__main__:main"
[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
# Previously a hand-written list that omitted plugins/, plugins.builtin/ and
# webhook/ — a pip-installed AutoDJ crashed on import of the plugin manager.
include = ["camfrog_autodj*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
# pythonpath = ["."]  # removed to avoid path resolution issues on CI
filterwarnings = [
    # Suppress third-party deprecation warnings from dependencies
    "ignore::DeprecationWarning:starlette",
    # fastapi.testclient (third-party) nags about httpx vs httpx2; not our code
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # pywinauto reports COM apartment coercion on headless CI runners; it is an
    # environment notice from a dependency, not an AutoDJ warning.
    "ignore:Apply externally defined coinit_flags",
    "ignore:Revert to STA COM threading mode",
]

[tool.mypy]
# Third-party dependencies used by AutoDJ ship without type stubs
# (pywinauto, pyttsx3, mutagen, yt_dlp, pyperclip). Missing stubs are
# ignored so the release typecheck gate validates AutoDJ's own code
# instead of failing on unstubbed dependencies.
ignore_missing_imports = true
# Check the bodies of untyped functions too, so missing annotations and latent
# attribute/method errors (e.g. gui.py, engine.py) surface here instead of at
# runtime. Enabled per the type-safety audit in this PR.
check_untyped_defs = true

[tool.ruff]
# Ruff configuration for AutoDJ source code.
# line-length = 100 keeps long TOML/regex strings and Windows paths readable.
line-length = 100

[tool.ruff.lint]
# Enable a focused subset of rules: errors, bugs, imports, style, naming, complexity, and security.
select = ["E", "F", "B", "I", "C", "N", "S"]
# Ignore rules that are noisy for this codebase (Windows-only ctypes imports,
# deliberate broad except clauses, test-file monkeypatching patterns).
ignore = [
    "E501",   # line too long (long paths/regexes are intentional)
    "B014",   # bare except with comment (defensive patterns are intentional)
    "BLE001", # broad except (defensive; chat loop must never crash)
    "S101",   # assert (used in tests and internal invariants)
    "S108",   # subprocess without shell=True (we never use shell=True)
    "S307",   # subprocess without shell=True (we never use shell=True)
    "S603",   # subprocess call (checked inputs, trusted paths only)
    "S607",   # subprocess with partial path (paths are resolved explicitly)
    "S608",   # subprocess with shell=True (never used)
]
# RUF012 (mutable class attribute) is intentional for PillButton.STYLES;
# the STYLES dict in gui.py already carries a `# noqa: RUF012` comment.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008", "N802", "S101", "S311"]
"tools/*" = ["S101", "S603", "S608"]

[tool.bandit]
# `bandit -c pyproject.toml -r .` — security scan of shipped/tooling code.
# tests/ is excluded: pytest asserts (B101) and fake fixture values (0.0.0.0,
# /tmp paths, dummy secrets) are intentional there. Vendored binaries and the
# forensic samples folder are not project source.
exclude_dirs = ["tests", ".git", "build", "dist", "mpv", "camfrog_autodj/mpv", "docs/rea", ".mypy_cache", ".venv"]
