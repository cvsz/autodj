name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -y && sudo apt-get install -y python3-tk xvfb
          fi
      - run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a python -m pytest -q
          else
            python -m pytest -q
          fi   # test_gui_smoke skips itself where there is no display/Tk
