name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install -e . "pytest==8.3.3" ruff mypy

      - name: Lint (ruff)
        run: |
          ruff check camfrog_autodj tests tools
          ruff format --check camfrog_autodj tests tools

      - name: Typecheck (mypy)
        run: mypy camfrog_autodj

      - name: Install Linux GUI test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y python3-tk xvfb

      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q -p no:faulthandler -p no:cacheprovider

      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: python -m pytest -q -p no:faulthandler -p no:cacheprovider
