name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -e . "pytest==7.4.4"
      - name: Run tests (Python 3.12)
        if: matrix.python == '3.12'
        run: python -m pytest -q -p no:faulthandler -p no:cacheprovider
      - name: Run tests (Python 3.11 with minipytest)
        if: matrix.python == '3.11'
        run: python tools/minipytest.py tests