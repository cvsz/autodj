name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . "pytest==7.4.4"
      - if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y python3-tk xvfb
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q -p no:faulthandler -p no:cacheprovider
      - if: runner.os != 'Linux'
        run: python -m pytest -q -p no:faulthandler -p no:cacheprovider
