name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install -e . "pytest==7.4.4"

      - name: Install Linux GUI test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y python3-tk xvfb

      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q -p no:faulthandler -p no:cacheprovider

      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: python -m pytest -q -p no:faulthandler -p no:cacheprovider
