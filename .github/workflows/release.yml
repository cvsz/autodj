name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Gate 1: full validation before any build or publish ----
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      go: ${{ steps.checks.outputs.go }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -e . "pytest==7.4.4" ruff mypy

      - name: Run unit tests
        run: python -m pytest -q -p no:faulthandler -p no:cacheprovider

      - name: Lint (ruff)
        run: ruff check .

      - name: Strict typecheck (mypy)
        run: mypy camfrog_autodj

      - name: Security scan for committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|.*\.pem|.*\.key)$' | grep -v '^\.env\.example$'; then
            echo 'Potential secret-bearing file is tracked.'
            exit 1
          fi

      - name: Decide whether release may proceed
        id: checks
        run: |
          # All steps above must pass; if any failed the job fails and the release is blocked.
          echo "go=true" >> $GITHUB_OUTPUT

  # ---- Gate 2: build installer (only if validation passed) ----
  build-installer:
    needs: validate-release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install -e . pyinstaller cyclonedx-bom

      - name: Install NSIS
        run: |
          choco install nsis --yes
          echo "C:\\Program Files (x86)\\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install mpv via Chocolatey (reliable, version-pinned)
        run: |
          # Use Chocolatey for reliable mpv installation (avoids mpv.io 404s on old builds)
          choco install mpv --version=2024.01.01 --yes
          # Verify mpv.exe is on PATH
          if (-not (Get-Command mpv.exe -ErrorAction SilentlyContinue)) {
            Write-Error "mpv.exe not found on PATH after Chocolatey install"
            exit 1
          }
          "mpv installed via Chocolatey: $(mpv.exe --version | Select-Object -First 1)"

      - name: Build AutoDJ.exe
        run: |
          $signArgs = @("-Clean", "-NoSign")
          if ($env:AUTODJ_PFX -and $env:AUTODJ_PFX_PASSWORD) {
            $signArgs = @("-Clean", "-Pfx", $env:AUTODJ_PFX, "-Password", $env:AUTODJ_PFX_PASSWORD)
          } elseif ($env:AUTODJ_CERT_THUMBPRINT) {
            $signArgs = @("-Clean", "-Thumbprint", $env:AUTODJ_CERT_THUMBPRINT)
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File build.ps1 @signArgs

      - name: Build NSIS installer
        run: |
          & "C:\\Program Files (x86)\\NSIS\\makensis.exe" /DVERSION=${{ github.ref_name }} installer.nsi

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py environment --pyproject pyproject.toml -o Camfrog-AutoDJ-${{ github.ref_name }}.cdx.json

      - name: Generate SHA256 Checksums
        run: |
          Get-FileHash -Algorithm SHA256 dist\\AutoDJ.exe, Camfrog-AutoDJ-Setup-*.exe, Camfrog-AutoDJ-${{ github.ref_name }}.cdx.json | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Attest Build Artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/AutoDJ.exe
            Camfrog-AutoDJ-Setup-*.exe
            Camfrog-AutoDJ-${{ github.ref_name }}.cdx.json
            SHA256SUMS.txt

      - name: Upload Build Artifacts (Retention)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autodj-release-${{ github.ref_name }}
          path: |
            dist/AutoDJ.exe
            Camfrog-AutoDJ-Setup-*.exe
            Camfrog-AutoDJ-${{ github.ref_name }}.cdx.json
            SHA256SUMS.txt
          retention-days: 90

      # NOTE: The "Release" step that creates/publishes the GitHub Release is
      # intentionally NOT included here. Per the remediation protocol, no release
      # is created or published during remediation. A maintainer must explicitly
      # authorize and create the release after all gates pass and independent
      # review is complete.