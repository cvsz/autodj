name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install -e . pyinstaller cyclonedx-bom

      - name: Install NSIS
        run: |
          choco install nsis --yes
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build AutoDJ.exe
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File build.ps1 -Clean -NoSign

      - name: Build NSIS installer
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=${{ github.ref_name }} installer.nsi

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py poetry || cyclonedx-py requirements || python -m cyclonedx_py environment --outfile Camfrog-AutoDJ-${{ github.ref_name }}.cdx.json

      - name: Attest Build Artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            Camfrog-AutoDJ-Setup-${{ github.ref_name }}.exe
            Camfrog-AutoDJ-${{ github.ref_name }}.cdx.json

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Camfrog-AutoDJ-Setup-${{ github.ref_name }}.exe
            Camfrog-AutoDJ-${{ github.ref_name }}.cdx.json
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Camfrog AutoDJ ${{ github.ref_name }}
            
            Built from ${{ github.ref_name }} tag.
            Installer includes AutoDJ.exe + source code + docs + tools.
