name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install -e . pyinstaller cyclonedx-bom

      - name: Install NSIS
        run: |
          choco install nsis --yes
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build AutoDJ.exe
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File build.ps1 -Clean -NoSign

      - name: Build NSIS installer
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=${{ github.ref_name }} installer.nsi

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py environment --pyproject pyproject.toml -o Camfrog-AutoDJ-${{ github.ref_name }}.cdx.json

      - name: Generate SHA256 Checksums
        run: |
          Get-FileHash -Algorithm SHA256 dist\AutoDJ.exe, Camfrog-AutoDJ-Setup-*.exe, Camfrog-AutoDJ-${{ github.ref_name }}.cdx.json | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Attest Build Artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/AutoDJ.exe
            Camfrog-AutoDJ-Setup-*.exe
            Camfrog-AutoDJ-${{ github.ref_name }}.cdx.json
            SHA256SUMS.txt

      - name: Upload Build Artifacts (Retention)
        uses: actions/upload-artifact@v4
        with:
          name: autodj-release-${{ github.ref_name }}
          path: |
            dist/AutoDJ.exe
            Camfrog-AutoDJ-Setup-*.exe
            Camfrog-AutoDJ-${{ github.ref_name }}.cdx.json
            SHA256SUMS.txt
          retention-days: 90

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/AutoDJ.exe
            Camfrog-AutoDJ-Setup-*.exe
            Camfrog-AutoDJ-${{ github.ref_name }}.cdx.json
            SHA256SUMS.txt
          tag_name: ${{ github.ref_name }}
          name: Camfrog AutoDJ ${{ github.ref_name }}
          body: |
            Camfrog AutoDJ ${{ github.ref_name }}
            
            Built from ${{ github.ref_name }} tag.
            Installer includes AutoDJ.exe + source code + docs + tools.
            See attached SHA256SUMS.txt for checksums and CycloneDX SBOM for supply chain verification.
