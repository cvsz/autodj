name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Gate 1: full validation before any build or publish ----
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      go: ${{ steps.checks.outputs.go }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -e ".[webhook,hotreload]" "pytest==8.3.3" ruff mypy

      - name: Install GUI test dependencies
        run: |
          # The Microsoft package repository for Ubuntu 26.04 ("resolute") is
          # unavailable (403 Forbidden / unsigned) and breaks apt-get update.
          # Remove its sources.list entries so apt can refresh the Ubuntu
          # archives and install python3-tk / xvfb from the official mirrors.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          sudo rm -f /etc/apt/sources.list.d/prod*.list 2>/dev/null || true
          sudo apt-get update -y && sudo apt-get install -y python3-tk xvfb

      - name: Run unit tests
        # Same environment as tests.yml: optional extras (webhook/hotreload tests) + a display for Tk.
        run: xvfb-run -a python -m pytest -q -p no:faulthandler -p no:cacheprovider

      - name: Lint (ruff)
        run: ruff check autodj tests tools

      - name: Strict typecheck (mypy)
        run: mypy autodj

      - name: Security scan for committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|.*\.pem|.*\.key)$' | grep -v '^\.env\.example$'; then
            echo 'Potential secret-bearing file is tracked.'
            exit 1
          fi

      - name: Tag, package version and CHANGELOG agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match pyproject.toml version $pkg"; exit 1
          fi
          grep -Eq "^##[[:space:]]+\[?v?${pkg//./\\.}([^0-9.]|$)" CHANGELOG.md || { echo "CHANGELOG.md has no ## $pkg section"; exit 1; }

      - name: Decide whether release may proceed
        id: checks
        run: |
          # All steps above must pass; if any failed the job fails and the release is blocked.
          echo "go=true" >> $GITHUB_OUTPUT

  # ---- Gate 2: build installer (only if validation passed) ----
  build-installer:
    needs: validate-release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          # Same extras as windows-build.yml: PyInstaller bundles only what is installed,
          # and v0.3.13's exe shipped without watchdog ("config hot reload unavailable")
          # and without the webhook server dependencies.
          python -m pip install -e ".[webhook,hotreload]" pyinstaller cyclonedx-bom

      - name: Install NSIS
        run: |
          choco install nsis --yes
          echo "C:\\Program Files (x86)\\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install mpv via Chocolatey (reliable, version-pinned)
        run: |
          # Use Chocolatey for reliable mpv installation (avoids mpv.io 404s on old builds)
          choco install mpv --version=2024.9.26 --yes
          if (-not (Get-Command mpv.exe -ErrorAction SilentlyContinue)) {
            # Some package versions install to Program Files without a shim: locate it.
            $found = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib", "C:\Program Files", "C:\Program Files (x86)" -Filter mpv.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $env:PATH = "$($found.DirectoryName);$env:PATH"
              $found.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
          # Verify mpv.exe is on PATH
          if (-not (Get-Command mpv.exe -ErrorAction SilentlyContinue)) {
            Write-Error "mpv.exe not found on PATH after Chocolatey install"
            exit 1
          }
          "mpv installed via Chocolatey: $(mpv.exe --version | Select-Object -First 1)"

      - name: Build zAutoDJ.exe
        env:
          # Repository secrets: AUTODJ_PFX_BASE64 (base64 of the .pfx) + AUTODJ_PFX_PASSWORD,
          # or AUTODJ_CERT_THUMBPRINT for a certificate already in the runner's store.
          AUTODJ_PFX_BASE64: ${{ secrets.AUTODJ_PFX_BASE64 }}
          AUTODJ_PFX_PASSWORD: ${{ secrets.AUTODJ_PFX_PASSWORD }}
          AUTODJ_CERT_THUMBPRINT: ${{ secrets.AUTODJ_CERT_THUMBPRINT }}
        run: |
          if ($env:AUTODJ_PFX_BASE64) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "autodj-signing.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:AUTODJ_PFX_BASE64))
            $env:AUTODJ_PFX = $pfxPath
          }
          $signArgs = @("-Clean", "-NoSign")
          if ($env:GITHUB_REF -like "refs/tags/*" -and -not (($env:AUTODJ_PFX -and $env:AUTODJ_PFX_PASSWORD) -or $env:AUTODJ_CERT_THUMBPRINT)) {
            Write-Error "Tagged releases must be Authenticode-signed: set AUTODJ_PFX/AUTODJ_PFX_PASSWORD or AUTODJ_CERT_THUMBPRINT secrets."
            exit 1
          }
          if ($env:AUTODJ_PFX -and $env:AUTODJ_PFX_PASSWORD) {
            $signArgs = @("-Clean", "-Pfx", $env:AUTODJ_PFX, "-Password", $env:AUTODJ_PFX_PASSWORD)
          } elseif ($env:AUTODJ_CERT_THUMBPRINT) {
            $signArgs = @("-Clean", "-Thumbprint", $env:AUTODJ_CERT_THUMBPRINT)
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File build.ps1 @signArgs

      - name: Build NSIS installer
        shell: pwsh
        run: |
          # Tags are vX.Y.Z; pyproject.toml and installer.nsi use X.Y.Z.
          # Use the same script as windows-build.yml: it stages config.example.toml,
          # readme.txt, start.bat and check.bat into dist\ before running makensis
          # (calling makensis directly aborted v0.3.11: 'dist\start.bat -> no files found').
          # -OutDir . keeps the installer in the repo root, where the steps below look.
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build_installer.ps1 -Version $version -OutDir .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "zAutoDJ-Setup-$version.exe")) {
            Write-Error "Installer not found after build"
            exit 1
          }

      - name: Sign NSIS installer
        shell: pwsh
        env:
          AUTODJ_PFX_BASE64: ${{ secrets.AUTODJ_PFX_BASE64 }}
          AUTODJ_PFX_PASSWORD: ${{ secrets.AUTODJ_PFX_PASSWORD }}
          AUTODJ_CERT_THUMBPRINT: ${{ secrets.AUTODJ_CERT_THUMBPRINT }}
        run: |
          # build.ps1 signs zAutoDJ.exe; the installer itself was shipped unsigned (v0.3.9).
          # Sign it with the same certificate before checksums, attestation and upload.
          $installer = Get-ChildItem zAutoDJ-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { Write-Error "installer not found"; exit 1 }
          $signArgs = @("-File", $installer.FullName)
          $pfxPath = $null
          if ($env:AUTODJ_PFX_BASE64) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "autodj-signing-installer.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:AUTODJ_PFX_BASE64))
            $signArgs += @("-Pfx", $pfxPath, "-Password", $env:AUTODJ_PFX_PASSWORD)
          } elseif ($env:AUTODJ_CERT_THUMBPRINT) {
            $signArgs += @("-Thumbprint", $env:AUTODJ_CERT_THUMBPRINT)
          } elseif ($env:GITHUB_REF -like "refs/tags/*") {
            Write-Error "Tagged releases must sign the installer: set the signing secrets."
            exit 1
          } else {
            "no signing secrets: installer left unsigned (non-tag build)"
            exit 0
          }
          try {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\sign_exe.ps1 @signArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            if ($pfxPath) { Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue }
          }
          $sig = Get-AuthenticodeSignature $installer.FullName
          if (-not $sig.SignerCertificate) { Write-Error "installer is not signed"; exit 1 }
          "installer signed by $($sig.SignerCertificate.Subject) ($($sig.Status))"

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py environment --pyproject pyproject.toml -o zAutoDJ-${{ github.ref_name }}.cdx.json

      - name: Package Full Client Build
        shell: pwsh
        run: |
          # A single archive clients can download instead of chasing individual
          # assets: exe, installer, config example and the mpv bundle when staged.
          $stage = Join-Path $env:RUNNER_TEMP "autodj-full"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist\zAutoDJ.exe, config.example.toml, README.md, CHANGELOG.md $stage -Force
          Copy-Item zAutoDJ-Setup-*.exe $stage -Force
          if (Test-Path dist\mpv) { Copy-Item dist\mpv (Join-Path $stage mpv) -Recurse -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "zAutoDJ-Full-${{ github.ref_name }}.zip" -Force

      - name: Generate SHA256 Checksums
        run: |
          Get-FileHash -Algorithm SHA256 dist\\zAutoDJ.exe, zAutoDJ-Setup-*.exe, zAutoDJ-Full-${{ github.ref_name }}.zip, zAutoDJ-${{ github.ref_name }}.cdx.json | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Attest Build Artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/zAutoDJ.exe
            zAutoDJ-Setup-*.exe
            zAutoDJ-Full-${{ github.ref_name }}.zip
            zAutoDJ-${{ github.ref_name }}.cdx.json
            SHA256SUMS.txt

      - name: Upload Build Artifacts (Retention)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autodj-release-${{ github.ref_name }}
          path: |
            dist/zAutoDJ.exe
            zAutoDJ-Setup-*.exe
            zAutoDJ-Full-${{ github.ref_name }}.zip
            zAutoDJ-${{ github.ref_name }}.cdx.json
            SHA256SUMS.txt
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/zAutoDJ.exe
            zAutoDJ-Setup-*.exe
            zAutoDJ-Full-${{ github.ref_name }}.zip
            zAutoDJ-${{ github.ref_name }}.cdx.json
            SHA256SUMS.txt
          generate_release_notes: true
          # Immutable releases are enabled: assets cannot be added once a release is
          # published, so create a draft, attach everything, then publish below.
          draft: true
          prerelease: false

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
